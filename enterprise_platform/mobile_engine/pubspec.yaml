name: signtalk_mobile_engine
description: "SignTalk Enterprise Mobile Engine - Advanced MediaPipe Holistic, LLM Grammar Correction & Smart SOS Dispatcher."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI Design
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  font_awesome_flutter: ^10.7.0

  # Hardware, GPS & Sensors
  camera: ^0.10.5+9
  geolocator: ^10.1.0
  permission_handler: ^11.3.0

  # AI & Machine Learning Edge Engine
  tflite_flutter: ^0.10.4

  # Network & Speech
  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.0
  http: ^1.2.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
