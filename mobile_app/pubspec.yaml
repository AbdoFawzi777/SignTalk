name: signtalk
description: "SignTalk - Smart Real-Time Sign Language Translator for the Deaf and Hard of Hearing."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design System
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  font_awesome_flutter: ^10.7.0
  flutter_animate: ^4.5.0

  # Hardware, Camera & Sensors
  camera: ^0.10.5+9
  permission_handler: ^11.3.0

  # AI & Machine Learning Edge Engine
  tflite_flutter: ^0.10.4

  # Speech & Audio Engine (Two-Way Communication)
  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.0

  # State Management & Utilities
  provider: ^6.1.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/labels.txt
    - assets/models/signtalk_model.tflite
